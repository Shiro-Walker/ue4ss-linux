name: Build libUE4SS for Debian 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install GCC 13 from PPA
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 libstdc++-13-dev \
            cmake ninja-build git pkg-config

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure CMake
        run: |
          cmake -B build_linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Game__Shipping__Linux64 \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DUE4SS_GUI_ENABLED=OFF \
            -DUE4SS_INPUT_ENABLED=OFF \
            -DUE4SS_PROFILERS=OFF \
            -Wno-dev 2>&1 | tee cmake_configure.log

      - name: Upload configure log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configure-log
          path: cmake_configure.log

      - name: Build
        run: cmake --build build_linux --target UE4SS --parallel

      - name: Verify GLIBC requirements
        run: |
          find build_linux -name "libUE4SS*.so" | while read f; do
            echo "=== $f ==="
            echo "--- GLIBC version requirements ---"
            objdump -p "$f" | grep GLIBC || echo "(no versioned GLIBC symbols)"
            echo "--- Dynamic dependencies ---"
            readelf -d "$f" | grep NEEDED
          done

      - name: Find and collect output
        run: |
          find build_linux -name "libUE4SS*.so" | tee /tmp/found_libs.txt
          mkdir -p /tmp/artifacts
          while IFS= read -r f; do cp "$f" /tmp/artifacts/; done < /tmp/found_libs.txt
          ls -lh /tmp/artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libUE4SS-debian12-compatible
          path: /tmp/artifacts/
          if-no-files-found: error